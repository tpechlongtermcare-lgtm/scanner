<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>QR 掃描器 v7 - 興岩點班系統</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;color:#fff;overflow-x:hidden;min-height:100vh;min-height:100dvh}

.top-bar{background:rgba(0,0,0,0.88);padding:env(safe-area-inset-top,8px) 14px 8px;display:flex;justify-content:space-between;align-items:center;position:fixed;top:0;left:0;right:0;z-index:10;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);gap:8px}
.top-bar h3{font-size:0.9rem;font-weight:700;white-space:nowrap}
.badge{background:rgba(76,175,80,0.3);padding:3px 10px;border-radius:12px;font-size:0.75rem;color:#81C784;white-space:nowrap}
.btn-close{background:rgba(255,255,255,0.15);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}

#reader{width:100vw;height:100vh;height:100dvh}
#reader video{object-fit:cover!important;width:100%!important;height:100%!important}

.scan-frame{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:250px;height:250px;z-index:5;pointer-events:none;display:none}
.corner{position:absolute;width:28px;height:28px;border-color:#4CAF50;border-style:solid;border-width:0}
.c-tl{top:0;left:0;border-top-width:4px;border-left-width:4px;border-radius:6px 0 0 0}
.c-tr{top:0;right:0;border-top-width:4px;border-right-width:4px;border-radius:0 6px 0 0}
.c-bl{bottom:0;left:0;border-bottom-width:4px;border-left-width:4px;border-radius:0 0 0 6px}
.c-br{bottom:0;right:0;border-bottom-width:4px;border-right-width:4px;border-radius:0 0 6px 0}
.laser{position:absolute;top:0;left:10%;right:10%;height:3px;background:linear-gradient(90deg,transparent,#4CAF50,transparent);animation:laserAni 2s ease-in-out infinite}
@keyframes laserAni{0%{top:0}50%{top:calc(100% - 3px)}100%{top:0}}

.prog-bar{position:fixed;top:calc(env(safe-area-inset-top,8px) + 44px);left:0;right:0;z-index:9;padding:0 14px}
.prog-track{height:6px;background:rgba(255,255,255,0.18);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,#4CAF50,#81C784);width:0%;transition:width .4s ease}
.prog-text{font-size:0.72rem;color:rgba(255,255,255,0.65);text-align:center;margin-top:4px}

.status-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,0.9);padding:12px 16px env(safe-area-inset-bottom,12px);text-align:center;z-index:10;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hint{font-size:0.85rem;color:rgba(255,255,255,0.55)}
.btn-list{background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.25);color:#fff;padding:9px 20px;border-radius:20px;font-size:0.85rem;font-weight:600;cursor:pointer;margin-top:8px}

.fb-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:fbIn .2s ease;padding:24px}
@keyframes fbIn{from{opacity:0;transform:scale(0.88)}to{opacity:1;transform:scale(1)}}
.fb-overlay.success{background:rgba(46,125,50,0.94)}
.fb-overlay.warning{background:rgba(245,124,0,0.94)}
.fb-overlay.error{background:rgba(211,47,47,0.94)}
.fb-overlay.info{background:rgba(28,28,30,0.94)}
.fb-icon{font-size:4.6rem;animation:iconPop .4s ease}
@keyframes iconPop{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.fb-text{font-size:1.25rem;font-weight:700;margin-top:14px;text-align:center}
.fb-sub{font-size:0.85rem;margin-top:8px;opacity:0.85;text-align:center;line-height:1.7}
.btn-retry{background:#fff;color:#333;border:none;padding:13px 32px;border-radius:24px;font-weight:700;margin-top:20px;font-size:0.95rem;cursor:pointer}

.card-wrap{position:fixed;top:0;left:0;right:0;bottom:0;z-index:25;background:rgba(0,0,0,0.55);display:flex;align-items:flex-end;justify-content:center}
.card{background:#fff;color:#333;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:22px 20px env(safe-area-inset-bottom,20px);max-height:88vh;overflow-y:auto;animation:cardSlide .28s cubic-bezier(0.2,0.8,0.3,1)}
@keyframes cardSlide{from{transform:translateY(100%)}to{transform:translateY(0)}}
.card h3{font-size:1.12rem;font-weight:800;text-align:center;margin-bottom:6px}
.item-id{font-size:0.78rem;color:#888;text-align:center;font-family:monospace;background:#f5f5f5;padding:5px 12px;border-radius:8px;margin-bottom:14px}
.loc-label{font-size:0.85rem;font-weight:700;color:#E53935;margin-bottom:8px}
.loc-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.loc-btn{padding:8px 15px;border-radius:20px;border:2px solid #e0e0e0;background:#fff;font-size:0.85rem;font-weight:600;color:#555;cursor:pointer}
.loc-btn.active{border-color:#1976D2;background:#1976D2;color:#fff}
.loc-input{width:100%;padding:12px 14px;border:2px solid #e0e0e0;border-radius:14px;font-size:0.95rem;font-family:inherit;text-align:center;font-weight:600}
.loc-input:focus{outline:none;border-color:#1976D2}
.chk-box{background:#FFF5F5;border-radius:14px;padding:12px 14px;margin:12px 0;border:1px solid #FFCDD2}
.chk-row{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:0.9rem}
.chk-row input[type=checkbox]{width:22px;height:22px;accent-color:#4CAF50}
.chk-row label{flex:1;cursor:pointer}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn-action{flex:1;padding:14px;border:none;border-radius:16px;font-size:1rem;font-weight:700;cursor:pointer}
.btn-action:active{transform:scale(0.97)}
.btn-ok{background:linear-gradient(135deg,#E8A04C,#D4842A);color:#fff}
.btn-ok:disabled{opacity:0.35}
.btn-fault{background:#fff;border:2px solid #EF6C00;color:#EF6C00;flex:0.55}
.btn-cancel{background:none;border:none;color:#aaa;font-size:0.9rem;width:100%;padding:11px;margin-top:6px;cursor:pointer}
.spinner{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

.repair-input{width:100%;padding:14px;border:2px solid #e0e0e0;border-radius:14px;font-size:1rem;margin-bottom:12px;resize:none;font-family:inherit}
.repair-input:focus{outline:none;border-color:#E53935}
.repair-btn{width:100%;padding:14px;border:none;border-radius:16px;font-size:1rem;font-weight:700;background:linear-gradient(135deg,#E53935,#C62828);color:#fff;cursor:pointer}

.list-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.list-head h3{font-size:1.05rem;font-weight:800}
.loc-group{font-size:0.82rem;font-weight:800;color:#D4842A;margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid #eee}
.list-row{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid #f2f2f2;gap:10px}
.list-name{font-size:0.9rem;font-weight:600}
.list-id{font-size:0.72rem;color:#999;font-family:monospace}
.btn-quick{background:#D4842A;color:#fff;border:none;padding:7px 14px;border-radius:16px;font-size:0.8rem;font-weight:700;white-space:nowrap;cursor:pointer}

.start-screen{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,#0d1117,#161b22,#1a2332);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
.start-icon{font-size:4.2rem;margin-bottom:16px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.start-title{font-size:1.3rem;font-weight:700;margin-bottom:6px}
.start-sub{font-size:0.82rem;color:rgba(255,255,255,0.45);margin-bottom:20px;text-align:center;line-height:1.8}
.start-btn{background:linear-gradient(135deg,#4CAF50,#2E7D32);color:#fff;border:none;padding:17px 54px;border-radius:30px;font-size:1.1rem;font-weight:700;cursor:pointer;box-shadow:0 6px 26px rgba(76,175,80,0.35)}
.start-btn:disabled{background:linear-gradient(135deg,#78909C,#455A64);box-shadow:none}
.start-btn:active{transform:scale(0.96)}
.start-note{margin-top:16px;font-size:0.74rem;color:rgba(255,255,255,0.32);text-align:center;max-width:300px;line-height:1.8}
.err-box{background:rgba(211,47,47,0.18);border:1px solid rgba(239,83,80,0.5);color:#EF9A9A;border-radius:14px;padding:14px 16px;font-size:0.78rem;line-height:1.9;max-width:340px;margin-bottom:20px;text-align:left;word-break:break-all}
.err-box b{color:#FFCDD2}
.info-chip{background:rgba(255,255,255,0.08);border-radius:12px;padding:10px 18px;font-size:0.82rem;color:rgba(255,255,255,0.72);margin-bottom:20px;text-align:center;line-height:1.8}
.badge-pend{background:rgba(255,167,38,0.28);color:#FFCC80;padding:3px 10px;border-radius:12px;font-size:0.72rem;white-space:nowrap;margin-left:4px}
.badge-fail{background:rgba(239,83,80,0.3);color:#EF9A9A;padding:3px 10px;border-radius:12px;font-size:0.72rem;white-space:nowrap;margin-left:4px;cursor:pointer}
.chan{display:inline-block;background:rgba(76,175,80,0.22);color:#A5D6A7;border-radius:8px;padding:2px 10px;font-size:0.72rem;margin-top:6px}
.log-box{background:rgba(255,255,255,0.05);border-radius:10px;padding:10px 12px;font-size:0.68rem;color:rgba(255,255,255,0.5);max-width:340px;margin-bottom:18px;line-height:1.9;font-family:monospace;word-break:break-all}
.st-badge{display:inline-block;padding:4px 12px;border-radius:12px;font-size:0.8rem;font-weight:700;margin:0 auto 12px}
.st-fault{background:#FFEBEE;color:#C62828}
.st-fixing{background:#E3F2FD;color:#1565C0}
.st-ok{background:#E8F5E9;color:#2E7D32}
.note-box{background:#FFF8E1;border:1px solid #FFE082;border-radius:12px;padding:10px 12px;font-size:0.82rem;color:#8D6E00;line-height:1.7;margin-bottom:12px}
.date-input{width:100%;padding:13px;border:2px solid #e0e0e0;border-radius:14px;font-size:1rem;font-family:inherit;text-align:center;font-weight:600;margin-bottom:4px}
.date-input:focus{outline:none;border-color:#2E7D32}
.btn-fix{background:linear-gradient(135deg,#1976D2,#1565C0);color:#fff}
.btn-back{background:linear-gradient(135deg,#43A047,#2E7D32);color:#fff}
.step-hint{font-size:0.78rem;color:#888;text-align:center;margin-bottom:10px;line-height:1.7}
.diag-link{display:inline-block;margin-top:8px;color:#90CAF9;font-size:0.76rem;text-decoration:underline}
</style>
</head>
<body>

<div class="top-bar">
  <h3 id="titleBar">📷 掃描器</h3>
  <span class="badge" id="countBadge">0 / 0</span>
  <span class="badge-pend" id="pendBadge" style="display:none">⏳ 0</span>
  <span class="badge-fail" id="failBadge" style="display:none" onclick="retryFailed()">⚠ 0 重試</span>
  <button class="btn-close" id="btnClose">✕</button>
</div>

<div class="prog-bar" id="progBar" style="display:none">
  <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
  <div class="prog-text" id="progText"></div>
</div>

<div class="scan-frame" id="scanFrame">
  <div class="corner c-tl"></div><div class="corner c-tr"></div>
  <div class="corner c-bl"></div><div class="corner c-br"></div>
  <div class="laser"></div>
</div>

<div id="reader"></div>
<div id="fbEl"></div>
<div id="cardEl"></div>

<div class="status-bar" id="statusBar" style="display:none">
  <div class="hint" id="hint">對準 QR Code 自動掃描</div>
  <button class="btn-list" id="btnList">📋 待點清單 / 手動點班</button>
</div>

<div class="start-screen" id="startScreen">
  <div class="start-icon">📷</div>
  <div class="start-title">QR Code 掃描器</div>
  <div class="start-sub" id="startSub">興岩點班系統 v7</div>
  <div id="errBox"></div>
  <div id="infoChip"></div>
  <div id="logBox"></div>
  <button class="start-btn" id="startBtn" disabled>連線中…</button>
  <div class="start-note" id="startNote">正在測試連線通道…</div>
</div>

<script>
// ==============================================================
// v5：雙軌傳輸
//   通道 A = fetch（速度快，需 CORS 支援）
//   通道 B = JSONP（<script> 標籤，不受 CORS 限制）
// 啟動時自動測試，選能用的那條；畫面會顯示用了哪一條。
// ==============================================================
var Q = new URLSearchParams(location.search);
var GAS_URL   = Q.get('gas') || '';
var TOKEN     = Q.get('t')   || '';
var USER_NAME = Q.get('u')   || '';
var SHIFT     = Q.get('s')   || '';
var FORCE_LATE= Q.get('late') === '1';
var MODE      = (Q.get('m') || 'check').toLowerCase();   // check | repair
var IS_REPAIR = (MODE === 'repair');

var DEFAULT_LOCS = ['護理站','A區','B區','大廳','庫房','治療室','會議室','辦公室'];
var locations = (function(){
  try { var a = JSON.parse(Q.get('locs')); if (Array.isArray(a) && a.length) return a; } catch(e){}
  return DEFAULT_LOCS.slice();
})();

var allItems = [], doneIds = {}, scanner = null, paused = true, currentItem = null;
var jsonpSeq = 0;
var CHANNEL = null;          // 'fetch' | 'jsonp'
var bootLog = [];

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function log(msg){ bootLog.push(msg); renderLog(); }
function renderLog(){
  if (!bootLog.length) return;
  $('logBox').className = 'log-box';
  $('logBox').innerHTML = bootLog.map(function(l){ return '· ' + esc(l); }).join('<br>');
}

function beep(){
  try{ navigator.vibrate && navigator.vibrate([50,30,50]); }catch(e){}
  try{
    var ctx=new (window.AudioContext||window.webkitAudioContext)();
    var o=ctx.createOscillator(), g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type='sine'; o.frequency.value=880;
    g.gain.setValueAtTime(0.15,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.15);
    o.start(); o.stop(ctx.currentTime+0.15);
  }catch(e){}
}

// ---------- 通道 A：fetch ----------
function viaFetch(params, timeoutMs){
  var qs = ['token=' + encodeURIComponent(TOKEN)];
  for (var k in params) {
    if (params[k] !== undefined && params[k] !== null) {
      qs.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
    }
  }
  var url = GAS_URL + (GAS_URL.indexOf('?') < 0 ? '?' : '&') + qs.join('&');

  var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var timer = setTimeout(function(){ if (ctrl) ctrl.abort(); }, timeoutMs || 20000);

  var opts = { method:'GET', redirect:'follow' };
  if (ctrl) opts.signal = ctrl.signal;

  return fetch(url, opts)
    .then(function(r){ clearTimeout(timer); return r.json(); })
    .catch(function(e){ clearTimeout(timer); throw e; });
}

// ---------- 通道 B：JSONP ----------
function viaJsonp(params, timeoutMs){
  return new Promise(function(resolve, reject){
    var cbName = 'xyCb' + (++jsonpSeq) + '_' + Date.now();
    var script = document.createElement('script');
    var done = false;

    var timer = setTimeout(function(){
      if (done) return;
      done = true; cleanup();
      reject(new Error('JSONP 逾時'));
    }, timeoutMs || 20000);

    function cleanup(){
      clearTimeout(timer);
      try { delete window[cbName]; } catch(e){ window[cbName] = undefined; }
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[cbName] = function(data){
      if (done) return;
      done = true; cleanup(); resolve(data);
    };

    var qs = ['token=' + encodeURIComponent(TOKEN), 'callback=' + cbName];
    for (var k in params) {
      if (params[k] !== undefined && params[k] !== null) {
        qs.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
      }
    }
    script.src = GAS_URL + (GAS_URL.indexOf('?') < 0 ? '?' : '&') + qs.join('&');
    script.onerror = function(){
      if (done) return;
      done = true; cleanup();
      reject(new Error('JSONP 載入失敗'));
    };
    document.head.appendChild(script);
  });
}

// ---------- 統一入口：用已選定的通道 ----------
function api(params, timeoutMs){
  if (CHANNEL === 'fetch') return viaFetch(params, timeoutMs);
  if (CHANNEL === 'jsonp') return viaJsonp(params, timeoutMs);
  return Promise.reject(new Error('尚未建立連線通道'));
}

// ---------- 啟動：自動選通道 ----------
$('btnClose').addEventListener('click', closeSelf);
$('btnList').addEventListener('click', showPendingList);
$('startBtn').addEventListener('click', startCamera);

function fail(html, note){
  $('errBox').className = 'err-box';
  $('errBox').innerHTML = html +
    (GAS_URL ? '<br><a class="diag-link" href="' + esc(GAS_URL) + '?action=ping&token=' + encodeURIComponent(TOKEN) + '" target="_blank">▶ 直接測試 API</a>' : '');
  $('startBtn').textContent = '重新載入';
  $('startBtn').disabled = false;
  $('startBtn').onclick = function(){ location.reload(); };
  $('startNote').textContent = note || '';
}

function pickChannel(){
  log('測試通道 A（fetch）…');
  return viaFetch({ action:'ping' }, 10000)
    .then(function(r){
      if (r && r.success) { CHANNEL = 'fetch'; log('✓ 通道 A 可用'); return; }
      throw new Error('ping 回應異常');
    })
    .catch(function(e1){
      log('✗ 通道 A 失敗：' + (e1.message || e1));
      log('測試通道 B（JSONP）…');
      return viaJsonp({ action:'ping' }, 12000).then(function(r){
        if (r && r.success) { CHANNEL = 'jsonp'; log('✓ 通道 B 可用'); return; }
        throw new Error('ping 回應異常');
      }).catch(function(e2){
        log('✗ 通道 B 失敗：' + (e2.message || e2));
        throw new Error('兩條通道都無法連線');
      });
    });
}

function boot(){
  if (!GAS_URL || !TOKEN || !USER_NAME || (!IS_REPAIR && !SHIFT)) {
    fail('<b>⚠️ 缺少啟動參數</b><br>這一頁必須從主系統開啟。<br><br>' +
         '請回到「興岩點班系統」→ 選擇班別 → 按「啟動掃描」。', '');
    return;
  }
  if (GAS_URL.indexOf('PASTE_YOUR') >= 0 || GAS_URL.indexOf('/exec') < 0) {
    fail('<b>⚠️ GAS 網址設定錯誤</b><br>收到：' + esc(GAS_URL) + '<br><br>' +
         '請在 Index.html 的 <b>GAS_EXEC_URL</b> 填入正確的 /exec 網址。', '請聯繫系統管理者（鄭瑞賢）');
    return;
  }

  $('titleBar').textContent = IS_REPAIR
    ? '🔧 維修處理 · ' + USER_NAME
    : '📷 ' + SHIFT + '班 · ' + USER_NAME;
  if (IS_REPAIR) {
    $('startSub').innerHTML = '興岩點班系統 v7<br>維修處理模式（不需選班別）';
    $('btnList').textContent = '🔧 待處理清單';
  }

  pickChannel()
    .then(function(){
      $('startNote').textContent = '載入物品清單…';
      if (IS_REPAIR) return Promise.all([ api({ action:'items' }) ]);
      return Promise.all([ api({ action:'items' }), api({ action:'checked', shift: SHIFT }) ]);
    })
    .then(function(res){
      var r1 = res[0], r2 = res[1];
      if (!r1 || !r1.success) throw new Error((r1 && r1.message) || '物品清單讀取失敗');

      if (IS_REPAIR) {
        // 維修模式：全部物品都要能掃到（含故障／送修中）
        allItems = (r1.items || []);
      } else {
        allItems = (r1.items||[]).filter(function(i){
          return i.category === '護理組' &&
                 String(i.status||'').indexOf('故障') < 0 &&
                 String(i.status||'').indexOf('送修') < 0;
        });
        ((r2 && r2.ids)||[]).forEach(function(id){ doneIds[String(id)] = true; });
      }

      updateProgress();
      $('infoChip').className = 'info-chip';
      $('infoChip').innerHTML = IS_REPAIR
        ? '✓ 已連線資料庫<br>待處理維修：' + pendingRepairs().length + ' 項' +
          '<br><span class="chan">通道：' + (CHANNEL === 'fetch' ? 'A · fetch' : 'B · JSONP') + '</span>'
        : '✓ 已連線資料庫<br>共 ' + allItems.length + ' 項，已完成 ' + doneCount() + ' 項' +
          '<br><span class="chan">通道：' + (CHANNEL === 'fetch' ? 'A · fetch' : 'B · JSONP') + '</span>';
      $('startBtn').disabled = false;
      $('startBtn').textContent = '▶ 啟動掃描';
      $('startNote').textContent = IS_REPAIR
        ? '掃描故障品 → 轉送修中；掃描送修中 → 賦歸正常。'
        : '掃描結果直接寫入資料庫，不需保持主系統分頁開著。';
    })
    .catch(function(err){
      fail('<b>⚠️ 無法連線資料庫</b><br>' + esc(String(err.message||err)) + '<br><br>' +
           '請檢查：<br>1. GAS 部署權限是否為「<b>任何人</b>」<br>' +
           '2. 是否已建立「<b>新版本</b>」部署<br>3. token 是否兩邊一致',
           '請聯繫系統管理者（鄭瑞賢）');
    });
}
boot();

// ---------- 進度 ----------
function doneCount(){ return allItems.filter(function(i){ return doneIds[i.id]; }).length; }
function remaining(){ return allItems.filter(function(i){ return !doneIds[i.id]; }); }

/** 維修模式：非「正常」狀態的物品 */
function pendingRepairs(){
  return allItems.filter(function(i){ return String(i.status||'正常') !== '正常'; });
}

var repairHandled = 0;

function updateProgress(){
  if (IS_REPAIR) {
    var pend = pendingRepairs().length;
    $('countBadge').textContent = '待處理 ' + pend;
    $('progFill').style.width = '100%';
    $('progText').textContent = '本次已處理 ' + repairHandled + ' 項　尚待處理 ' + pend + ' 項';
    return;
  }
  var d = doneCount(), t = allItems.length;
  $('countBadge').textContent = d + ' / ' + t;
  var pct = t ? Math.round(d/t*100) : 0;
  $('progFill').style.width = pct + '%';
  $('progText').textContent = '完成 ' + pct + '%　剩餘 ' + (t-d) + ' 項';
}

// ---------- 相機 ----------
function startCamera(){
  $('startScreen').style.display = 'none';
  $('scanFrame').style.display = 'block';
  $('progBar').style.display = 'block';
  $('statusBar').style.display = 'block';
  paused = false;

  scanner = new Html5Qrcode('reader');
  scanner.start(
    { facingMode: 'environment' },
    { fps:10, qrbox:{ width:250, height:250 }, aspectRatio:1.0 },
    onScan, function(){}
  ).catch(function(err){
    $('scanFrame').style.display='none';
    $('reader').innerHTML =
      '<div style="padding:90px 24px;text-align:center">' +
      '<div style="font-size:3.4rem;margin-bottom:14px">❌</div>' +
      '<div style="font-size:1.05rem;font-weight:700;margin-bottom:10px">相機啟動失敗</div>' +
      '<div style="font-size:0.78rem;color:rgba(255,255,255,0.5);margin-bottom:20px;word-break:break-all">' + esc(err) + '</div>' +
      '<button onclick="location.reload()" style="background:#4CAF50;color:#fff;border:none;padding:13px 34px;border-radius:24px;font-weight:700">重新整理</button>' +
      '<button onclick="showPendingList()" style="background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.4);padding:12px 30px;border-radius:24px;font-weight:600;margin-top:12px;display:block;margin-left:auto;margin-right:auto">改用清單手動點班</button>' +
      '</div>';
  });
}

function onScan(text){
  if (paused) return;
  paused = true;
  beep();
  var item = allItems.find(function(i){ return String(i.id) === String(text); });
  if (!item) { showFb('error','❌','查無此財產編號', esc(text), 2200); return; }

  if (IS_REPAIR) { showRepairFlow(item); return; }

  if (doneIds[item.id]) { showFb('warning','✅','已完成點班', esc(item.name), 1600); return; }
  showConfirm(item);
}

// ==============================================================
// 維修處理流程（書記用，不需班別）
//   故障／故障送修  → 轉「送修中」
//   送修中          → 填修復日期 → 賦歸「正常」
// ==============================================================
function showRepairFlow(item){
  currentItem = item;
  $('fbEl').innerHTML = '';
  var st = String(item.status || '正常');

  if (st === '正常') {
    showFb('warning','ℹ️','狀態正常', esc(item.name) + '<br>此物品無需維修處理', 2000);
    return;
  }

  if (st === '送修中') {
    var today = new Date().toISOString().slice(0,10);
    $('cardEl').innerHTML =
      '<div class="card-wrap"><div class="card">' +
        '<h3>' + esc(item.name) + '</h3>' +
        '<div class="item-id">' + esc(item.id) + '</div>' +
        '<div style="text-align:center"><span class="st-badge st-fixing">目前：送修中</span></div>' +
        (item.repairNote ? '<div class="note-box"><b>故障原因</b><br>' + esc(item.repairNote) + '</div>' : '') +
        '<div class="step-hint">確認機台已修復並歸還後，<br>填寫修復完成日期即可賦歸。</div>' +
        '<label style="font-size:0.82rem;font-weight:700;color:#2E7D32">修復完成日期</label>' +
        '<input type="date" class="date-input" id="fixDate" value="' + today + '">' +
        '<div class="btn-row">' +
          '<button class="btn-action btn-back" id="btnDo" onclick="doRestore()">✅ 賦歸正常</button>' +
        '</div>' +
        '<button class="btn-cancel" onclick="doCancel()">取消</button>' +
      '</div></div>';
    return;
  }

  // 故障 / 故障送修
  $('cardEl').innerHTML =
    '<div class="card-wrap"><div class="card">' +
      '<h3>' + esc(item.name) + '</h3>' +
      '<div class="item-id">' + esc(item.id) + '</div>' +
      '<div style="text-align:center"><span class="st-badge st-fault">目前：' + esc(st) + '</span></div>' +
      (item.repairNote ? '<div class="note-box"><b>故障原因</b><br>' + esc(item.repairNote) + '</div>' : '') +
      '<div class="step-hint">已收到此故障機台、準備送外維修？<br>確認後狀態將轉為「送修中」。</div>' +
      '<div class="btn-row">' +
        '<button class="btn-action btn-fix" id="btnDo" onclick="doSetFixing()">🔧 轉為送修中</button>' +
      '</div>' +
      '<button class="btn-cancel" onclick="doCancel()">取消</button>' +
    '</div></div>';
}

function doSetFixing(){
  var it = currentItem;
  var btn = $('btnDo');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 處理中';

  api({ action:'setstatus', itemId: it.id, status: '送修中' }, 30000).then(function(res){
    if (!res || !res.success) { showFb('error','❌','更新失敗', esc((res&&res.message)||''), 2600); return; }
    it.status = '送修中';
    repairHandled++;
    updateProgress();
    showFb('success','🔧','已轉送修中', esc(it.name), 1600);
  }).catch(function(err){
    showFb('error','❌','網路異常', esc(String(err.message||err)), 0,
      '<button class="btn-retry" onclick="clearFb()">返回掃描</button>');
  });
}

function doRestore(){
  var it = currentItem;
  var d = $('fixDate').value;
  if (!d) { alert('請選擇修復完成日期'); return; }

  var btn = $('btnDo');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 處理中';

  api({ action:'restore', itemId: it.id, finishDate: d }, 30000).then(function(res){
    if (!res || !res.success) { showFb('error','❌','賦歸失敗', esc((res&&res.message)||''), 2600); return; }
    it.status = '正常';
    it.repairNote = '';
    repairHandled++;
    updateProgress();
    showFb('success','✅','已賦歸正常', esc(it.name) + '<br>已納回點班清單', 1800);
  }).catch(function(err){
    showFb('error','❌','網路異常', esc(String(err.message||err)), 0,
      '<button class="btn-retry" onclick="clearFb()">返回掃描</button>');
  });
}

// ---------- 回饋 ----------
function showFb(cls, icon, text, sub, ms, extra){
  $('cardEl').innerHTML = '';
  $('fbEl').innerHTML =
    '<div class="fb-overlay ' + cls + '"><div class="fb-icon">' + icon + '</div>' +
    '<div class="fb-text">' + text + '</div>' +
    (sub ? '<div class="fb-sub">' + sub + '</div>' : '') + (extra||'') + '</div>';
  if (ms > 0) setTimeout(clearFb, ms);
}
function clearFb(){
  $('fbEl').innerHTML = '';
  paused = false;
  $('hint').textContent = IS_REPAIR
    ? (pendingRepairs().length ? '繼續掃描下一台' : '🎉 維修項目已全部處理完')
    : (remaining().length ? '繼續掃描下一個' : '🎉 全部完成！可以關閉了');
}

// ---------- 確認卡片 ----------
function showConfirm(item){
  currentItem = item;
  $('fbEl').innerHTML = '';

  var nm = String(item.name||'');
  var isAED  = nm.toLowerCase().indexOf('aed') >= 0 || nm.indexOf('心臟') >= 0;
  var isFire = nm.indexOf('火警') >= 0 || nm.indexOf('119') >= 0;
  currentItem._loc = item.location || '';
  currentItem._aed = isAED;
  currentItem._fire = isFire;

  var btns = locations.map(function(l){
    return '<button class="loc-btn' + (l===currentItem._loc?' active':'') + '" onclick="pickLoc(this,\'' + l.replace(/'/g,"\\'") + '\')">' + esc(l) + '</button>';
  }).join('');

  var checks = '';
  if (isAED) checks = '<div class="chk-box">' +
    '<div class="chk-row"><input type="checkbox" id="ck1" onchange="updateOk()"><label for="ck1">功能顯示正常</label></div>' +
    '<div class="chk-row"><input type="checkbox" id="ck2" onchange="updateOk()"><label for="ck2">貼片未過期</label></div></div>';
  if (isFire) checks = '<div class="chk-box">' +
    '<div class="chk-row"><input type="checkbox" id="ck1" onchange="updateOk()"><label for="ck1">燈號／功能正常</label></div></div>';

  $('cardEl').innerHTML =
    '<div class="card-wrap"><div class="card">' +
      '<h3>' + esc(item.name) + '</h3>' +
      '<div class="item-id">' + esc(item.id) + '</div>' +
      '<div class="loc-label">位置 *必填</div>' +
      '<div class="loc-grid">' + btns + '</div>' +
      '<input class="loc-input" id="locInput" placeholder="或手動輸入位置" value="' + esc(currentItem._loc) + '" oninput="typeLoc(this.value)">' +
      checks +
      '<div class="btn-row">' +
        '<button class="btn-action btn-fault" onclick="goRepair()">🔧 故障</button>' +
        '<button class="btn-action btn-ok" id="btnOk" onclick="doConfirm()">✓ 確認正常</button>' +
      '</div>' +
      '<button class="btn-cancel" onclick="doCancel()">取消</button>' +
    '</div></div>';
  updateOk();
}

function pickLoc(el, loc){
  currentItem._loc = loc;
  document.querySelectorAll('.loc-btn').forEach(function(b){ b.classList.remove('active'); });
  el.classList.add('active');
  if ($('locInput')) $('locInput').value = loc;
  updateOk();
}
function typeLoc(v){
  if (!currentItem) return;
  currentItem._loc = (v||'').trim();
  document.querySelectorAll('.loc-btn').forEach(function(b){
    b.classList.toggle('active', b.textContent === currentItem._loc);
  });
  updateOk();
}
function updateOk(){
  if (!currentItem) return;
  var ok = !!currentItem._loc;
  if (currentItem._aed){ var a=$('ck1'), b=$('ck2'); if(a&&b) ok = ok && a.checked && b.checked; }
  if (currentItem._fire){ var c=$('ck1'); if(c) ok = ok && c.checked; }
  if ($('btnOk')) $('btnOk').disabled = !ok;
}

function doConfirm(){
  if (!currentItem || !currentItem._loc) return;

  var notes = [];
  if (currentItem._aed)  notes.push('AED檢查:正常');
  if (currentItem._fire) notes.push('火警檢查:正常');
  if (FORCE_LATE) notes.push('(逾時補點)');

  var it = currentItem;
  var loc = it._loc;

  // ★ 樂觀更新：立刻標記完成、立刻回到掃描，上傳在背景進行
  doneIds[it.id] = true;
  it.location = loc;
  updateProgress();
  showFb('success','✅','已記錄', esc(it.name) + '　剩餘 ' + remaining().length + ' 項', 900);

  queueUpload({
    action:'check', shift:SHIFT, userName:USER_NAME,
    itemId:it.id, location:loc,
    note:notes.join(' '), forceLate: FORCE_LATE ? 'true' : 'false'
  }, it.id, it.name);
}

// ---------- 背景上傳佇列 ----------
var pendingCount = 0;
var failedJobs = [];

function updateBadges(){
  var pb = $('pendBadge'), fb = $('failBadge');
  if (pendingCount > 0) { pb.style.display='inline-block'; pb.textContent = '⏳ ' + pendingCount; }
  else pb.style.display='none';
  if (failedJobs.length > 0) { fb.style.display='inline-block'; fb.textContent = '⚠ ' + failedJobs.length + ' 重試'; }
  else fb.style.display='none';
}

function queueUpload(params, itemId, itemName, isRetry){
  pendingCount++;
  updateBadges();

  api(params, 40000).then(function(res){
    pendingCount--; updateBadges();
    if (!res || !res.success) {
      markFailed(params, itemId, itemName, (res && res.message) || '未知錯誤');
    }
  }).catch(function(err){
    pendingCount--; updateBadges();
    markFailed(params, itemId, itemName, String(err.message || err));
  });
}

function markFailed(params, itemId, itemName, msg){
  // 回滾完成狀態，讓使用者知道這項沒成功
  delete doneIds[itemId];
  updateProgress();
  failedJobs.push({ params: params, itemId: itemId, itemName: itemName, msg: msg });
  updateBadges();
  $('hint').textContent = '⚠️ ' + itemName + ' 上傳失敗，請按右上角重試';
}

function retryFailed(){
  if (!failedJobs.length) return;
  var jobs = failedJobs.slice();
  failedJobs = [];
  updateBadges();
  jobs.forEach(function(j){
    doneIds[j.itemId] = true;
    updateProgress();
    queueUpload(j.params, j.itemId, j.itemName, true);
  });
  $('hint').textContent = '重新上傳 ' + jobs.length + ' 項…';
}

function doCancel(){
  $('cardEl').innerHTML = '';
  $('fbEl').innerHTML = '';
  currentItem = null;
  paused = false;
  $('hint').textContent = '繼續掃描下一個';
}

// ---------- 報修 ----------
function goRepair(){
  $('cardEl').innerHTML =
    '<div class="card-wrap"><div class="card">' +
      '<h3 style="color:#E53935">🔧 故障報修</h3>' +
      '<div class="item-id">' + esc(currentItem.name) + '　' + esc(currentItem.id) + '</div>' +
      '<textarea class="repair-input" id="rr" rows="3" placeholder="請輸入具體故障原因…"></textarea>' +
      '<button class="repair-btn" id="btnRr" onclick="doRepair()">送出報修</button>' +
      '<button class="btn-cancel" onclick="doCancel()">取消</button>' +
    '</div></div>';
}
function doRepair(){
  var reason = $('rr').value.trim();
  if (!reason) { alert('請填寫故障原因'); return; }
  var btn = $('btnRr');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 送出中';
  var it = currentItem;
  api({ action:'repair', itemId:it.id, reason:reason, userName:USER_NAME }, 30000)
    .then(function(res){
      if (res && res.duplicate) { showFb('warning','⚠️','已有報修紀錄', esc(res.message||''), 2600); return; }
      if (!res || !res.success)  { showFb('error','❌','報修失敗', esc((res&&res.message)||''), 2600); return; }
      allItems = allItems.filter(function(x){ return x.id !== it.id; });
      updateProgress();
      showFb('success','🔧','已送出報修', esc(it.name), 1800);
    })
    .catch(function(err){
      showFb('error','❌','網路異常', esc(String(err.message||err)), 0,
        '<button class="btn-retry" onclick="clearFb()">返回掃描</button>');
    });
}

// ---------- 待點清單 ----------
function showPendingList(){
  paused = true;

  if (IS_REPAIR) { showRepairList(); return; }

  var rest = remaining(), groups = {};
  rest.forEach(function(i){
    var l = i.location || '未設定';
    (groups[l] = groups[l] || []).push(i);
  });

  var html = '';
  Object.keys(groups).forEach(function(loc){
    html += '<div class="loc-group">📍 ' + esc(loc) + '（' + groups[loc].length + '）</div>';
    groups[loc].forEach(function(i){
      html += '<div class="list-row"><div><div class="list-name">' + esc(i.name) + '</div>' +
              '<div class="list-id">' + esc(i.id) + '</div></div>' +
              '<button class="btn-quick" onclick="manualPick(\'' + String(i.id).replace(/'/g,"\\'") + '\')">手動點班</button></div>';
    });
  });
  if (!rest.length) html = '<div style="text-align:center;padding:40px 0;color:#4CAF50;font-weight:700">🎉 全部完成！</div>';

  $('fbEl').innerHTML = '';
  $('cardEl').innerHTML =
    '<div class="card-wrap"><div class="card">' +
      '<div class="list-head"><h3>📋 待點清單（' + rest.length + '）</h3>' +
      '<button class="btn-quick" onclick="doCancel()">關閉</button></div>' + html +
    '</div></div>';
}
function showRepairList(){
  var list = pendingRepairs();
  var html = '';

  if (!list.length) {
    html = '<div style="text-align:center;padding:40px 0;color:#4CAF50;font-weight:700">🎉 目前無待處理維修</div>';
  } else {
    var fault = list.filter(function(i){ return String(i.status).indexOf('送修中') < 0; });
    var fixing = list.filter(function(i){ return String(i.status) === '送修中'; });

    if (fault.length) {
      html += '<div class="loc-group">🔴 待收件（故障）（' + fault.length + '）</div>';
      fault.forEach(function(i){
        html += '<div class="list-row"><div><div class="list-name">' + esc(i.name) + '</div>' +
                '<div class="list-id">' + esc(i.id) + '　' + esc(i.location||'') + '</div></div>' +
                '<button class="btn-quick" style="background:#1565C0" onclick="pickRepair(\'' + String(i.id).replace(/'/g,"\\'") + '\')">處理</button></div>';
      });
    }
    if (fixing.length) {
      html += '<div class="loc-group">🔵 送修中（待賦歸）（' + fixing.length + '）</div>';
      fixing.forEach(function(i){
        html += '<div class="list-row"><div><div class="list-name">' + esc(i.name) + '</div>' +
                '<div class="list-id">' + esc(i.id) + '　' + esc(i.location||'') + '</div></div>' +
                '<button class="btn-quick" style="background:#2E7D32" onclick="pickRepair(\'' + String(i.id).replace(/'/g,"\\'") + '\')">賦歸</button></div>';
      });
    }
  }

  $('fbEl').innerHTML = '';
  $('cardEl').innerHTML =
    '<div class="card-wrap"><div class="card">' +
      '<div class="list-head"><h3>🔧 待處理維修（' + list.length + '）</h3>' +
      '<button class="btn-quick" onclick="doCancel()">關閉</button></div>' + html +
    '</div></div>';
}

function pickRepair(id){
  var it = allItems.find(function(x){ return String(x.id) === String(id); });
  if (!it) return;
  showRepairFlow(it);
}

function manualPick(id){
  var it = allItems.find(function(x){ return String(x.id) === String(id); });
  if (!it) return;
  if (!confirm('⚠️ 手動點班（未掃 QR Code）\n\n請確認您已實際檢查此物品：\n' + it.name + '\n\n是否繼續？')) return;
  showConfirm(it);
}

// ---------- 離開前警告（直接關分頁時）----------
window.addEventListener('beforeunload', function(e){
  if (pendingCount > 0 || failedJobs.length > 0) {
    e.preventDefault();
    e.returnValue = '';
    return '';
  }
});

// ---------- 關閉 ----------
function closeSelf(){
  if (pendingCount > 0) {
    if (!confirm('還有 ' + pendingCount + ' 筆正在上傳中！\n\n現在離開可能導致資料未存入，建議等待 ⏳ 消失。\n\n仍要離開嗎？')) return;
  }
  if (failedJobs.length > 0) {
    if (!confirm('有 ' + failedJobs.length + ' 筆上傳失敗尚未重試！\n\n離開後這些項目不會被記錄。\n\n仍要離開嗎？')) return;
  }
  if (!IS_REPAIR) {
    var rest = remaining().length;
    if (rest > 0 && !confirm('還有 ' + rest + ' 項未點班，確定要離開嗎？')) return;
  }
  try { if (scanner) scanner.stop(); } catch(e){}
  try { if (window.opener) window.opener.postMessage({ type:'qr-scanner-closed' }, '*'); } catch(e){}
  window.close();
  setTimeout(function(){
    document.body.innerHTML =
      '<div style="padding:60px 24px;text-align:center;background:linear-gradient(160deg,#0d1117,#161b22);height:100vh;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center">' +
      '<div style="font-size:3.4rem;margin-bottom:14px">✅</div>' +
      '<div style="font-size:1.1rem;font-weight:700">掃描結束</div>' +
      '<div style="color:rgba(255,255,255,0.4);margin-top:10px;font-size:0.9rem">資料已寫入資料庫，請手動關閉此分頁</div></div>';
  }, 250);
}
</script>
