<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>QR 掃描器 v3 - 興岩點班系統</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;color:#fff;overflow-x:hidden;min-height:100vh;min-height:100dvh}

.top-bar{background:rgba(0,0,0,0.88);padding:env(safe-area-inset-top,8px) 14px 8px;display:flex;justify-content:space-between;align-items:center;position:fixed;top:0;left:0;right:0;z-index:10;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);gap:8px}
.top-bar h3{font-size:0.9rem;font-weight:700;white-space:nowrap}
.badge{background:rgba(76,175,80,0.3);padding:3px 10px;border-radius:12px;font-size:0.75rem;color:#81C784;white-space:nowrap}
.btn-close{background:rgba(255,255,255,0.15);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}

#reader{width:100vw;height:100vh;height:100dvh}
#reader video{object-fit:cover!important;width:100%!important;height:100%!important}

.scan-frame{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:250px;height:250px;z-index:5;pointer-events:none;display:none}
.corner{position:absolute;width:28px;height:28px;border-color:#4CAF50;border-style:solid;border-width:0}
.c-tl{top:0;left:0;border-top-width:4px;border-left-width:4px;border-radius:6px 0 0 0}
.c-tr{top:0;right:0;border-top-width:4px;border-right-width:4px;border-radius:0 6px 0 0}
.c-bl{bottom:0;left:0;border-bottom-width:4px;border-left-width:4px;border-radius:0 0 0 6px}
.c-br{bottom:0;right:0;border-bottom-width:4px;border-right-width:4px;border-radius:0 0 6px 0}
.laser{position:absolute;top:0;left:10%;right:10%;height:3px;background:linear-gradient(90deg,transparent,#4CAF50,transparent);animation:laserAni 2s ease-in-out infinite}
@keyframes laserAni{0%{top:0}50%{top:calc(100% - 3px)}100%{top:0}}

/* 進度條 */
.prog-bar{position:fixed;top:calc(env(safe-area-inset-top,8px) + 44px);left:0;right:0;z-index:9;padding:0 14px}
.prog-track{height:6px;background:rgba(255,255,255,0.18);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,#4CAF50,#81C784);width:0%;transition:width .4s ease}
.prog-text{font-size:0.72rem;color:rgba(255,255,255,0.65);text-align:center;margin-top:4px}

.status-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,0.9);padding:12px 16px env(safe-area-inset-bottom,12px);text-align:center;z-index:10;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hint{font-size:0.85rem;color:rgba(255,255,255,0.55)}
.btn-list{background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.25);color:#fff;padding:9px 20px;border-radius:20px;font-size:0.85rem;font-weight:600;cursor:pointer;margin-top:8px}

/* Feedback */
.fb-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:fbIn .2s ease;padding:24px}
@keyframes fbIn{from{opacity:0;transform:scale(0.88)}to{opacity:1;transform:scale(1)}}
.fb-overlay.success{background:rgba(46,125,50,0.94)}
.fb-overlay.warning{background:rgba(245,124,0,0.94)}
.fb-overlay.error{background:rgba(211,47,47,0.94)}
.fb-overlay.info{background:rgba(28,28,30,0.94)}
.fb-icon{font-size:4.6rem;animation:iconPop .4s ease}
@keyframes iconPop{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.fb-text{font-size:1.25rem;font-weight:700;margin-top:14px;text-align:center}
.fb-sub{font-size:0.85rem;margin-top:8px;opacity:0.85;text-align:center;line-height:1.7}
.btn-retry{background:#fff;color:#333;border:none;padding:13px 32px;border-radius:24px;font-weight:700;margin-top:20px;font-size:0.95rem;cursor:pointer}
.btn-ghost{background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.4);padding:11px 26px;border-radius:24px;font-weight:600;margin-top:10px;font-size:0.85rem;cursor:pointer}

/* Card */
.card-wrap{position:fixed;top:0;left:0;right:0;bottom:0;z-index:25;background:rgba(0,0,0,0.55);display:flex;align-items:flex-end;justify-content:center}
.card{background:#fff;color:#333;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:22px 20px env(safe-area-inset-bottom,20px);max-height:88vh;overflow-y:auto;animation:cardSlide .28s cubic-bezier(0.2,0.8,0.3,1)}
@keyframes cardSlide{from{transform:translateY(100%)}to{transform:translateY(0)}}
.card h3{font-size:1.12rem;font-weight:800;text-align:center;margin-bottom:6px}
.item-id{font-size:0.78rem;color:#888;text-align:center;font-family:monospace;background:#f5f5f5;padding:5px 12px;border-radius:8px;margin-bottom:14px}
.loc-label{font-size:0.85rem;font-weight:700;color:#E53935;margin-bottom:8px}
.loc-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.loc-btn{padding:8px 15px;border-radius:20px;border:2px solid #e0e0e0;background:#fff;font-size:0.85rem;font-weight:600;color:#555;cursor:pointer}
.loc-btn.active{border-color:#1976D2;background:#1976D2;color:#fff}
.loc-input{width:100%;padding:12px 14px;border:2px solid #e0e0e0;border-radius:14px;font-size:0.95rem;font-family:inherit;text-align:center;font-weight:600}
.loc-input:focus{outline:none;border-color:#1976D2}
.chk-box{background:#FFF5F5;border-radius:14px;padding:12px 14px;margin:12px 0;border:1px solid #FFCDD2}
.chk-row{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:0.9rem}
.chk-row input[type=checkbox]{width:22px;height:22px;accent-color:#4CAF50}
.chk-row label{flex:1;cursor:pointer}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn-action{flex:1;padding:14px;border:none;border-radius:16px;font-size:1rem;font-weight:700;cursor:pointer}
.btn-action:active{transform:scale(0.97)}
.btn-ok{background:linear-gradient(135deg,#E8A04C,#D4842A);color:#fff}
.btn-ok:disabled{opacity:0.35}
.btn-fault{background:#fff;border:2px solid #EF6C00;color:#EF6C00;flex:0.55}
.btn-cancel{background:none;border:none;color:#aaa;font-size:0.9rem;width:100%;padding:11px;margin-top:6px;cursor:pointer}
.spinner{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* Repair */
.repair-input{width:100%;padding:14px;border:2px solid #e0e0e0;border-radius:14px;font-size:1rem;margin-bottom:12px;resize:none;font-family:inherit}
.repair-input:focus{outline:none;border-color:#E53935}
.repair-btn{width:100%;padding:14px;border:none;border-radius:16px;font-size:1rem;font-weight:700;background:linear-gradient(135deg,#E53935,#C62828);color:#fff;cursor:pointer}

/* 待點清單 */
.list-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.list-head h3{font-size:1.05rem;font-weight:800}
.loc-group{font-size:0.82rem;font-weight:800;color:#D4842A;margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid #eee}
.list-row{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid #f2f2f2;gap:10px}
.list-name{font-size:0.9rem;font-weight:600}
.list-id{font-size:0.72rem;color:#999;font-family:monospace}
.btn-quick{background:#D4842A;color:#fff;border:none;padding:7px 14px;border-radius:16px;font-size:0.8rem;font-weight:700;white-space:nowrap;cursor:pointer}

/* Start */
.start-screen{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,#0d1117,#161b22,#1a2332);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.start-icon{font-size:4.6rem;margin-bottom:20px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.start-title{font-size:1.35rem;font-weight:700;margin-bottom:6px}
.start-sub{font-size:0.85rem;color:rgba(255,255,255,0.45);margin-bottom:22px;text-align:center;line-height:1.8}
.start-btn{background:linear-gradient(135deg,#4CAF50,#2E7D32);color:#fff;border:none;padding:17px 54px;border-radius:30px;font-size:1.1rem;font-weight:700;cursor:pointer;box-shadow:0 6px 26px rgba(76,175,80,0.35)}
.start-btn:disabled{background:linear-gradient(135deg,#78909C,#455A64);box-shadow:none}
.start-btn:active{transform:scale(0.96)}
.start-note{margin-top:18px;font-size:0.75rem;color:rgba(255,255,255,0.32);text-align:center;max-width:290px;line-height:1.8}
.err-box{background:rgba(211,47,47,0.18);border:1px solid rgba(239,83,80,0.5);color:#EF9A9A;border-radius:14px;padding:14px 16px;font-size:0.8rem;line-height:1.9;max-width:330px;margin-bottom:22px;text-align:left}
.err-box b{color:#FFCDD2}
.info-chip{background:rgba(255,255,255,0.08);border-radius:12px;padding:10px 18px;font-size:0.82rem;color:rgba(255,255,255,0.7);margin-bottom:22px;text-align:center;line-height:1.8}
</style>
</head>
<body>

<div class="top-bar">
  <h3 id="titleBar">📷 掃描器</h3>
  <span class="badge" id="countBadge">0 / 0</span>
  <button class="btn-close" id="btnClose">✕</button>
</div>

<div class="prog-bar" id="progBar" style="display:none">
  <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
  <div class="prog-text" id="progText"></div>
</div>

<div class="scan-frame" id="scanFrame">
  <div class="corner c-tl"></div><div class="corner c-tr"></div>
  <div class="corner c-bl"></div><div class="corner c-br"></div>
  <div class="laser"></div>
</div>

<div id="reader"></div>
<div id="fbEl"></div>
<div id="cardEl"></div>

<div class="status-bar" id="statusBar" style="display:none">
  <div class="hint" id="hint">對準 QR Code 自動掃描</div>
  <button class="btn-list" id="btnList">📋 待點清單 / 手動點班</button>
</div>

<div class="start-screen" id="startScreen">
  <div class="start-icon">📷</div>
  <div class="start-title">QR Code 掃描器</div>
  <div class="start-sub" id="startSub">興岩點班系統 v3</div>
  <div id="errBox"></div>
  <div id="infoChip"></div>
  <button class="start-btn" id="startBtn" disabled>載入中…</button>
  <div class="start-note" id="startNote">正在連線資料庫…</div>
</div>

<script>
// ==============================================================
// v3：直連 GAS，不依賴主分頁（window.opener 不再是必要條件）
// URL 參數：?gas=<GAS exec 網址>&t=<token>&u=<姓名>&s=<班別>&locs=[...]
// ==============================================================
var Q = new URLSearchParams(location.search);
var GAS_URL   = Q.get('gas') || '';
var TOKEN     = Q.get('t')   || '';
var USER_NAME = Q.get('u')   || '';
var SHIFT     = Q.get('s')   || '';
var FORCE_LATE= Q.get('late') === '1';

var DEFAULT_LOCS = ['護理站','A區','B區','大廳','庫房','治療室','會議室','辦公室'];
var locations = (function(){
  try { var a = JSON.parse(Q.get('locs')); if (Array.isArray(a) && a.length) return a; } catch(e){}
  return DEFAULT_LOCS.slice();
})();

var allItems = [];      // 護理組、非故障
var doneIds  = {};      // 已完成
var scanner  = null;
var paused   = true;
var currentItem = null;

// ---------- 小工具 ----------
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function beep(){
  try{ navigator.vibrate && navigator.vibrate([50,30,50]); }catch(e){}
  try{
    var ctx=new (window.AudioContext||window.webkitAudioContext)();
    var o=ctx.createOscillator(), g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type='sine'; o.frequency.value=880;
    g.gain.setValueAtTime(0.15,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.15);
    o.start(); o.stop(ctx.currentTime+0.15);
  }catch(e){}
}

// ---------- 與 GAS 溝通 ----------
function gasGet(action, extra){
  var u = GAS_URL + (GAS_URL.indexOf('?')<0?'?':'&') + 'action=' + action + '&token=' + encodeURIComponent(TOKEN);
  if (extra) { for (var k in extra) u += '&' + k + '=' + encodeURIComponent(extra[k]); }
  return fetch(u, { method:'GET', redirect:'follow' }).then(function(r){ return r.json(); });
}
function gasPost(payload){
  payload.token = TOKEN;
  return fetch(GAS_URL, {
    method: 'POST',
    redirect: 'follow',
    body: JSON.stringify(payload)   // 不設 headers → 簡單請求，避開 CORS 預檢
  }).then(function(r){ return r.json(); });
}

// ---------- 啟動流程 ----------
$('btnClose').addEventListener('click', closeSelf);
$('btnList').addEventListener('click', showPendingList);
$('btnStart');
$('startBtn').addEventListener('click', startCamera);

function fail(html, note){
  $('errBox').className = 'err-box';
  $('errBox').innerHTML = html;
  $('startBtn').textContent = '重新載入';
  $('startBtn').disabled = false;
  $('startBtn').onclick = function(){ location.reload(); };
  $('startNote').textContent = note || '';
}

function boot(){
  if (!GAS_URL || !TOKEN || !USER_NAME || !SHIFT) {
    fail('<b>⚠️ 缺少啟動參數</b><br>這一頁必須從主系統開啟。<br><br>' +
         '請回到「興岩點班系統」→ 選擇班別 → 按「啟動掃描」。<br><br>' +
         '（不要用書籤／歷史紀錄直接開這一頁）', '');
    return;
  }

  $('titleBar').textContent = '📷 ' + SHIFT + '班 · ' + USER_NAME;

  Promise.all([ gasGet('items'), gasGet('checked', { shift: SHIFT }) ])
    .then(function(res){
      var r1 = res[0], r2 = res[1];
      if (!r1.success) { fail('<b>⚠️ 讀取物品清單失敗</b><br>' + esc(r1.message||''), ''); return; }

      allItems = (r1.items||[]).filter(function(i){
        return i.category === '護理組' &&
               String(i.status||'').indexOf('故障') < 0 &&
               String(i.status||'').indexOf('送修') < 0;
      });
      (r2.ids||[]).forEach(function(id){ doneIds[String(id)] = true; });

      updateProgress();
      $('infoChip').className = 'info-chip';
      $('infoChip').innerHTML = '✓ 已連線資料庫<br>共 ' + allItems.length + ' 項，已完成 ' + doneCount() + ' 項';
      $('startBtn').disabled = false;
      $('startBtn').textContent = '▶ 啟動掃描';
      $('startNote').textContent = '掃描結果會直接寫入資料庫，不需要保持主系統分頁開著。';
    })
    .catch(function(err){
      fail('<b>⚠️ 無法連線資料庫</b><br>' + esc(String(err)) + '<br><br>' +
           '可能原因：<br>1. GAS 部署權限不是「所有人」<br>2. 網路不穩<br>3. token 設定不一致',
           '請聯繫系統管理者（鄭瑞賢）');
    });
}
boot();

// ---------- 進度 ----------
function doneCount(){ return allItems.filter(function(i){ return doneIds[i.id]; }).length; }
function remaining(){ return allItems.filter(function(i){ return !doneIds[i.id]; }); }
function updateProgress(){
  var d = doneCount(), t = allItems.length;
  $('countBadge').textContent = d + ' / ' + t;
  var pct = t ? Math.round(d/t*100) : 0;
  $('progFill').style.width = pct + '%';
  $('progText').textContent = '完成 ' + pct + '%　剩餘 ' + (t-d) + ' 項';
}

// ---------- 相機 ----------
function startCamera(){
  $('startScreen').style.display = 'none';
  $('scanFrame').style.display = 'block';
  $('progBar').style.display = 'block';
  $('statusBar').style.display = 'block';
  paused = false;

  scanner = new Html5Qrcode('reader');
  scanner.start(
    { facingMode: 'environment' },
    { fps:10, qrbox:{ width:250, height:250 }, aspectRatio:1.0 },
    onScan,
    function(){}
  ).catch(function(err){
    $('scanFrame').style.display='none';
    $('reader').innerHTML =
      '<div style="padding:90px 24px;text-align:center">' +
      '<div style="font-size:3.4rem;margin-bottom:14px">❌</div>' +
      '<div style="font-size:1.05rem;font-weight:700;margin-bottom:10px">相機啟動失敗</div>' +
      '<div style="font-size:0.78rem;color:rgba(255,255,255,0.5);margin-bottom:20px;word-break:break-all">' + esc(err) + '</div>' +
      '<button onclick="location.reload()" style="background:#4CAF50;color:#fff;border:none;padding:13px 34px;border-radius:24px;font-weight:700">重新整理</button>' +
      '<button onclick="showPendingList()" style="background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.4);padding:12px 30px;border-radius:24px;font-weight:600;margin-top:12px;display:block;margin-left:auto;margin-right:auto">改用清單手動點班</button>' +
      '</div>';
  });
}

function onScan(text){
  if (paused) return;
  paused = true;
  beep();
  var item = allItems.find(function(i){ return String(i.id) === String(text); });

  if (!item) {
    showFb('error','❌','查無此財產編號', esc(text) + '<br>可能不在點班清單，或已報修中', 2200);
    return;
  }
  if (doneIds[item.id]) {
    showFb('warning','✅','已完成點班', esc(item.name), 1600);
    return;
  }
  showConfirm(item);
}

// ---------- 回饋 ----------
function showFb(cls, icon, text, sub, ms, extra){
  $('cardEl').innerHTML = '';
  $('fbEl').innerHTML =
    '<div class="fb-overlay ' + cls + '">' +
    '<div class="fb-icon">' + icon + '</div>' +
    '<div class="fb-text">' + text + '</div>' +
    (sub ? '<div class="fb-sub">' + sub + '</div>' : '') +
    (extra || '') + '</div>';
  if (ms > 0) setTimeout(clearFb, ms);
}
function clearFb(){
  $('fbEl').innerHTML = '';
  paused = false;
  $('hint').textContent = remaining().length ? '繼續掃描下一個' : '🎉 全部完成！可以關閉了';
}

// ---------- 確認卡片 ----------
function showConfirm(item){
  currentItem = item;
  $('fbEl').innerHTML = '';

  var nm = String(item.name||'');
  var isAED  = nm.toLowerCase().indexOf('aed') >= 0 || nm.indexOf('心臟') >= 0;
  var isFire = nm.indexOf('火警') >= 0 || nm.indexOf('119') >= 0;
  currentItem._loc = item.location || '';
  currentItem._old = item.location || '';
  currentItem._aed = isAED;
  currentItem._fire = isFire;

  var btns = locations.map(function(l){
    return '<button class="loc-btn' + (l===currentItem._loc?' active':'') + '" onclick="pickLoc(this,\'' + l.replace(/'/g,"\\'") + '\')">' + esc(l) + '</button>';
  }).join('');

  var checks = '';
  if (isAED) checks = '<div class="chk-box">' +
    '<div class="chk-row"><input type="checkbox" id="ck1" onchange="updateOk()"><label for="ck1">功能顯示正常</label></div>' +
    '<div class="chk-row"><input type="checkbox" id="ck2" onchange="updateOk()"><label for="ck2">貼片未過期</label></div></div>';
  if (isFire) checks = '<div class="chk-box">' +
    '<div class="chk-row"><input type="checkbox" id="ck1" onchange="updateOk()"><label for="ck1">燈號／功能正常</label></div></div>';

  $('cardEl').innerHTML =
    '<div class="card-wrap"><div class="card">' +
      '<h3>' + esc(item.name) + '</h3>' +
      '<div class="item-id">' + esc(item.id) + '</div>' +
      '<div class="loc-label">位置 *必填</div>' +
      '<div class="loc-grid">' + btns + '</div>' +
      '<input class="loc-input" id="locInput" placeholder="或手動輸入位置" value="' + esc(currentItem._loc) + '" oninput="typeLoc(this.value)">' +
      checks +
      '<div class="btn-row">' +
        '<button class="btn-action btn-fault" onclick="goRepair()">🔧 故障</button>' +
        '<button class="btn-action btn-ok" id="btnOk" onclick="doConfirm()">✓ 確認正常</button>' +
      '</div>' +
      '<button class="btn-cancel" onclick="doCancel()">取消</button>' +
    '</div></div>';
  updateOk();
}

function pickLoc(el, loc){
  currentItem._loc = loc;
  document.querySelectorAll('.loc-btn').forEach(function(b){ b.classList.remove('active'); });
  el.classList.add('active');
  if ($('locInput')) $('locInput').value = loc;
  updateOk();
}
function typeLoc(v){
  if (!currentItem) return;
  currentItem._loc = (v||'').trim();
  document.querySelectorAll('.loc-btn').forEach(function(b){
    b.classList.toggle('active', b.textContent === currentItem._loc);
  });
  updateOk();
}
function updateOk(){
  if (!currentItem) return;
  var ok = !!currentItem._loc;
  if (currentItem._aed){ var a=$('ck1'), b=$('ck2'); if(a&&b) ok = ok && a.checked && b.checked; }
  if (currentItem._fire){ var c=$('ck1'); if(c) ok = ok && c.checked; }
  if ($('btnOk')) $('btnOk').disabled = !ok;
}

function doConfirm(){
  if (!currentItem || !currentItem._loc) return;
  var btn = $('btnOk');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 上傳中';

  var notes = [];
  if (currentItem._aed)  notes.push('AED檢查:正常');
  if (currentItem._fire) notes.push('火警檢查:正常');
  if (FORCE_LATE) notes.push('(逾時補點)');

  var it = currentItem;
  gasPost({
    action:'check', shift:SHIFT, userName:USER_NAME,
    itemId:it.id, itemName:it.name,
    location:it._loc, oldLocation:it._old,
    note:notes.join(' '), forceLate:FORCE_LATE
  }).then(function(res){
    if (!res.success) { showFb('error','❌','上傳失敗', esc(res.message||''), 2600); return; }
    doneIds[it.id] = true;
    it.location = it._loc;
    updateProgress();
    if (res.isLate) showFb('warning','⚠️','已記錄（補點）', esc(it.name), 1800);
    else showFb('success','✅','上傳成功', esc(it.name) + '　剩餘 ' + remaining().length + ' 項', 1500);
  }).catch(function(err){
    showFb('error','❌','網路異常', '請確認網路後重掃一次<br>' + esc(String(err)), 0,
      '<button class="btn-retry" onclick="clearFb()">重新掃描</button>');
  });
}

function doCancel(){
  $('cardEl').innerHTML = '';
  currentItem = null;
  paused = false;
  $('hint').textContent = '繼續掃描下一個';
}

// ---------- 報修 ----------
function goRepair(){
  $('cardEl').innerHTML =
    '<div class="card-wrap"><div class="card">' +
      '<h3 style="color:#E53935">🔧 故障報修</h3>' +
      '<div class="item-id">' + esc(currentItem.name) + '　' + esc(currentItem.id) + '</div>' +
      '<textarea class="repair-input" id="rr" rows="3" placeholder="請輸入具體故障原因…"></textarea>' +
      '<button class="repair-btn" id="btnRr" onclick="doRepair()">送出報修</button>' +
      '<button class="btn-cancel" onclick="doCancel()">取消</button>' +
    '</div></div>';
}
function doRepair(){
  var reason = $('rr').value.trim();
  if (!reason) { alert('請填寫故障原因'); return; }
  var btn = $('btnRr');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 送出中';
  var it = currentItem;
  gasPost({ action:'repair', itemId:it.id, reason:reason, userName:USER_NAME })
    .then(function(res){
      if (res.duplicate) { showFb('warning','⚠️','已有報修紀錄', esc(res.message||''), 2600); return; }
      if (!res.success)  { showFb('error','❌','報修失敗', esc(res.message||''), 2600); return; }
      allItems = allItems.filter(function(x){ return x.id !== it.id; });
      updateProgress();
      showFb('success','🔧','已送出報修', esc(it.name), 1800);
    })
    .catch(function(err){
      showFb('error','❌','網路異常', esc(String(err)), 0,
        '<button class="btn-retry" onclick="clearFb()">返回掃描</button>');
    });
}

// ---------- 待點清單（手動點班備援） ----------
function showPendingList(){
  paused = true;
  var rest = remaining();
  var groups = {};
  rest.forEach(function(i){
    var l = i.location || '未設定';
    (groups[l] = groups[l] || []).push(i);
  });

  var html = '';
  Object.keys(groups).forEach(function(loc){
    html += '<div class="loc-group">📍 ' + esc(loc) + '（' + groups[loc].length + '）</div>';
    groups[loc].forEach(function(i){
      html += '<div class="list-row"><div><div class="list-name">' + esc(i.name) + '</div>' +
              '<div class="list-id">' + esc(i.id) + '</div></div>' +
              '<button class="btn-quick" onclick="manualPick(\'' + String(i.id).replace(/'/g,"\\'") + '\')">手動點班</button></div>';
    });
  });
  if (!rest.length) html = '<div style="text-align:center;padding:40px 0;color:#4CAF50;font-weight:700">🎉 全部完成！</div>';

  $('fbEl').innerHTML = '';
  $('cardEl').innerHTML =
    '<div class="card-wrap"><div class="card">' +
      '<div class="list-head"><h3>📋 待點清單（' + rest.length + '）</h3>' +
      '<button class="btn-quick" onclick="doCancel()">關閉</button></div>' +
      html +
    '</div></div>';
}
function manualPick(id){
  var it = allItems.find(function(x){ return String(x.id) === String(id); });
  if (!it) return;
  if (!confirm('⚠️ 手動點班（未掃 QR Code）\n\n請確認您已實際檢查此物品：\n' + it.name + '\n\n是否繼續？')) return;
  showConfirm(it);
}

// ---------- 關閉 ----------
function closeSelf(){
  var rest = remaining().length;
  if (rest > 0 && !confirm('還有 ' + rest + ' 項未點班，確定要離開嗎？')) return;
  try { if (scanner) scanner.stop(); } catch(e){}
  try { if (window.opener) window.opener.postMessage({ type:'qr-scanner-closed' }, '*'); } catch(e){}
  window.close();
  setTimeout(function(){
    document.body.innerHTML =
      '<div style="padding:60px 24px;text-align:center;background:linear-gradient(160deg,#0d1117,#161b22);height:100vh;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center">' +
      '<div style="font-size:3.4rem;margin-bottom:14px">✅</div>' +
      '<div style="font-size:1.1rem;font-weight:700">掃描結束</div>' +
      '<div style="color:rgba(255,255,255,0.4);margin-top:10px;font-size:0.9rem">資料已寫入資料庫，請手動關閉此分頁</div></div>';
  }, 250);
}
</script>
